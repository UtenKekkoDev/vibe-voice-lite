name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit publishable files
        run: python scripts/audit_release.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Check and lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests (no microphone, GPU or API key required)
        run: cargo test --locked --all-targets
      - name: Python syntax
        run: python -m compileall -q tts scripts
      - name: Build and package
        run: |
          cargo build --locked --release --bin vibe-voice-lite
          ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ci-bundle
          path: |
            dist/*.zip
            dist/*.sha256
