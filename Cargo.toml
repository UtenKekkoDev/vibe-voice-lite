[package]
name = "vibe-voice-lite"
version = "0.2.0-preview.2"
edition = "2024"
authors = ["Yuxuan Sun"]
description = "Hold-to-talk local voice input bar for Windows, based on vibe-coding-voice."
license = "MIT"
readme = "README.md"
keywords = ["voice-input", "egui", "sensevoice", "windows"]
categories = ["gui", "multimedia::audio"]

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
cpal = "0.16"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.31"
native-tls = "0.2"
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
serde_json = "1"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
url = "2.5"
tungstenite = { version = "0.26", features = ["native-tls"] }
tray-icon = "0.21"
transcribe-rs = { version = "=0.2.9", features = ["sense_voice"] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
hound = "3.5"

[patch.crates-io]
# Official pollster 0.4.0 source, included for reproducible offline builds.
pollster = { path = "vendor/pollster" }
# Keep runtime DLL copying compatible with Cargo's nested build output layout.
ort-sys = { path = "vendor/ort-sys" }
